services:
  hotdeal-bot:
    build: .
    restart: unless-stopped
    init: true  # Xvfb+브라우저 프로세스가 좀비 없이 정리되도록 PID 1을 tini가 맡는다
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    ports:
      # webapp.enabled: true 일 때만 사용됨. 미니앱 미사용 시 이 매핑은 지워도 무방합니다.
      # 이 포트로 nginx 등 리버스 프록시가 연결해 HTTPS를 제공해야 합니다.
      - "8080:8080"
