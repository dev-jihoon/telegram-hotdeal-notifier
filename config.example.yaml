telegram:
  bot_token: "REPLACE_ME"       # @BotFather 에서 발급받은 봇 토큰
  default_chat_id: -1000000000000   # 핫딜을 올릴 기본 채널/그룹 chat_id
  admin_chat_id: -1000000000000     # 크롤러 실패 알림을 받을 chat_id (기본 채널과 같아도 무방)

database:
  path: "data/hotdeals.db"

crawl:
  listing_pages: 2                   # 사이트별로 한 번에 확인할 목록 페이지 수
  retention_days: 5                  # 삭제 확인된 글의 DB 이력을 이 기간 후 정리 (살아있는 글은 안 지움)
  likes_edit_throttle_minutes: 10    # 추천수만 바뀐 경우 메시지 수정 최소 간격(분)
  failure_alert_threshold: 3         # 이 횟수만큼 연속 실패하면 admin_chat_id로 알림
  failure_realert_every: 30          # 알림 이후에도 계속 실패하면 이 횟수마다 재알림
  deletion_check_cooldown_minutes: 30  # 삭제 확인(개별 페이지 요청)은 글마다 이 간격 이상 지나야 재시도
  max_deletion_checks_per_cycle: 15    # 한 사이클에 삭제 확인할 글 수 상한 (사이트 차단 방지용)
  resume_silent_threshold_minutes: 20  # 마지막 성공 크롤 이후 이만큼 지나서 재개되면, 밀린 글을
                                        # 한꺼번에 전송하지 않고 조용히 기준선만 다시 잡습니다

digest:
  enabled: false                     # true로 켜면 매일 정해진 시각에 인기 핫딜 요약을 보냅니다
  hour: 9                            # 전송 시각 (KST, 24시간제)
  minute: 0
  top_n: 5                           # 추천수 상위 몇 개를 보여줄지
  # chat_id: -1009999999999          # 다이제스트를 다른 채널로 보내고 싶을 때 (선택, 기본 default_chat_id)

webapp:
  enabled: false                     # true로 켜면 "오늘의 인기 핫딜" 텔레그램 미니앱을 제공합니다
  port: 8080                         # 컨테이너 내부에서 미니앱 웹서버가 열리는 포트
  # public_url: "https://hotdeal.example.com"  # nginx 등으로 위 포트를 프록시한 HTTPS 주소.
  # 비워두면 미니앱 서버는 뜨지만 봇 메뉴 버튼은 연결되지 않습니다 (텔레그램은 HTTPS만 허용).
  # short_name: "hotdeals"            # BotFather에서 /newapp 으로 Mini App을 등록했을 때 받는 짧은 이름.
  # 이걸 채워두면 채널/그룹 핫딜 메시지에도 "🔥 인기 핫딜" 버튼이 붙습니다 (t.me/bot/short_name
  # 딥링크 - 텔레그램이 이 형식만 채널에서도 진짜 미니앱으로 열어줍니다). 비워두면 이 버튼은 안 붙습니다.

webhook:
  enabled: false                     # true로 켜면 브라우저 확장(extension/)이 보내는 웹훅을 받습니다.
  # secret: "REPLACE_ME_WITH_LONG_RANDOM_STRING"  # extension/config.js의 WEBHOOK_SECRET과
  # 반드시 동일해야 합니다. 이 값이 없으면 webhook.enabled=true여도 엔드포인트가 404를 반환합니다.
  heartbeat_stale_minutes: 30        # 확장이 이만큼(분) 아무 신호도 안 보내면 admin_chat_id로 경고합니다
  # (웹탑/브라우저 세션이 죽었다는 뜻 - Cloudflare가 서버 크롤러를 막는 사이트(아카라이브 등)를
  # 대신 감시해주는 브라우저 확장이 살아있는지 확인하는 용도입니다. extension/README나 저장소
  # 루트 README의 "브라우저 확장" 절 참고.)

display:
  # 아래 값들은 텔레그램 관리자 채팅의 /settings 명령으로도 재배포 없이 바로 편집할 수
  # 있습니다. 여기 값은 관리자가 한 번도 편집하지 않았을 때만 적용되는 기본값입니다.
  show_site_name: true               # 메시지에 [뽐뿌] 같은 사이트명 접두사를 표시할지
  webapp_button_label: "🔥 인기 핫딜"  # 메시지/다이제스트에 붙는 미니앱 버튼 문구
  webapp_title: "🔥 오늘의 인기 핫딜"   # 미니앱 페이지 제목
  webapp_empty_message: "오늘 올라온 핫딜이 아직 없습니다."
  digest_header: "🔥 오늘의 인기 핫딜 TOP"
  digest_mall_ranking_label: "🏪 오늘의 인기 쇼핑몰"

sites:
  ppomppu:
    enabled: true
    interval_seconds: 60
  clien:
    enabled: true
    interval_seconds: 60
  ruliweb:
    enabled: true
    interval_seconds: 60
  arcalive:
    # Cloudflare 차단이 너무 강해 서버 크롤러(requests/curl_cffi/헤드리스 브라우저 전부)로는
    # 뚫리지 않습니다. extension/ 브라우저 확장이 웹훅으로 대신 글을 밀어넣는 방식을 씁니다
    # (webhook.enabled: true 필요). 확장을 아직 안 붙였다면 enabled: false로 꺼두세요 - 폴링
    # 크롤러를 켜둬봤자 계속 403만 받습니다.
    enabled: true
    interval_seconds: 60
  fmkorea:
    enabled: true
    interval_seconds: 60
  coolenjoy:
    enabled: true
    interval_seconds: 60
  damoang:
    enabled: true
    interval_seconds: 60
  quasarzone:
    # Cloudflare 봇 차단이 걸려있어 curl_cffi(브라우저 위장)로 우회합니다.
    # 대부분의 환경에서 잘 동작하지만, 서버 IP 평판에 따라 막힐 수 있습니다.
    # 계속 막히면 enabled: false로 끄고 다른 사이트만 사용하세요.
    enabled: true
    interval_seconds: 90
  zod:
    # 퀘이사존과 마찬가지로 Cloudflare 우회(curl_cffi)를 사용합니다. Cloudflare 설정이
    # 더 엄격한 사이트라 curl_cffi로도 계속 막히는 경우가 있습니다 - 그럴 땐
    # enabled: false로 꺼두세요 (헤드리스 브라우저로 뚫는 시도는 해봤지만 이 사이트의
    # 차단 수준에서는 효과가 없어서 requests 방식 하나로 유지합니다).
    enabled: true
    interval_seconds: 90

  # 사이트 추가 예시 — src/crawlers/<site>.py 에 BaseCrawler 구현 +
  # @register_crawler("<site>") 등록 후, 여기에 동일한 키로 항목만 추가하면 됩니다.
  # newsite:
  #   enabled: true
  #   interval_seconds: 60
  #   chat_id: -1009999999999   # 이 사이트만 다른 채널로 보내고 싶을 때 (선택)
